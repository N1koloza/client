<div class="rounded-lg border border-gray-200 bg-white p-4 shadow-sm mb-4">
    <div class="flex items-center gap-6">

        <!-- Product image -->
        <a [routerLink]="['/shop', item().productId]" class="shrink-0">
            <img [src]="item().pictureUrl" alt="product image" class="h-20 w-20 object-contain" />
        </a>

        <!-- Main content -->
        <div class="flex flex-1 justify-between items-center">

            <!-- Product info -->
            <div class="space-y-2">
                <a [routerLink]="['/shop', item().productId]" class="font-medium text-lg">
                    {{ item().productName }}
                </a>

                <button mat-button color="warn" class="flex items-center gap-1">
                    <mat-icon>delete</mat-icon>
                    Delete
                </button>
            </div>

            <!-- Quantity & price -->
            <div class="flex items-center gap-6">

                <!-- Quantity controls -->
                <div class="flex items-center gap-3">
                    <button mat-icon-button>
                        <mat-icon class="text-red-600">remove</mat-icon>
                    </button>

                    <span class="font-semibold text-xl">
                        {{ item().quantity }}
                    </span>

                    <button mat-icon-button>
                        <mat-icon class="text-green-600">add</mat-icon>
                    </button>
                </div>

                <!-- Price -->
                <div class="text-right w-32">
                    <p class="font-bold text-xl">
                        {{ item().price | currency }}
                    </p>
                </div>

            </div>
        </div>
    </div>
</div>
